---
- name: Déployer le site web avec Nginx
  hosts: webservers
  become: true
  tasks:
    - name: Installer Nginx sans forcer la mise à jour du cache apt
      apt:
        name: nginx
        state: present
        update_cache: no # Désactivé pour éviter le blocage de l'APT

    - name: S'assurer que le service Nginx est démarré et actif
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copier le contenu du dossier site vers le dossier Nginx
      copy:
        src: "./site/"
        dest: "/var/www/html/"
        mode: '0644'